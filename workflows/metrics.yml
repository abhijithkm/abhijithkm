name: Generate Metrics

on:
  schedule:
    # Runs every day at 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Main metrics panel
        uses: lowlighter/metrics@latest
        with:
          # A personal access token stored as the METRICS_TOKEN secret.
          # Do NOT use the default GITHUB_TOKEN here — metrics needs broader read scope.
          token: ${{ secrets.METRICS_TOKEN }}
          user: abhijithkm
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          # Language breakdown
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          # Isometric contribution calendar (the eye-catching one)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # Recent activity feed rendered as an image
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
